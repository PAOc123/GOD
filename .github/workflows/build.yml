name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files
        run: mkdir -p app/src/main/java/com/example/chesshelper && mv app-build.gradle.kts app/build.gradle.kts && mv AndroidManifest.xml app/src/main/AndroidManifest.xml && mv *.kt app/src/main/java/com/example/chesshelper/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: chess-helper-apk
          path: app/build/outputs/apk/debug/app-debug.apk
