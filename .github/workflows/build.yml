name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/example/chesshelper [ -f app-build.gradle.kts ] && mv app-build.gradle.kts app/build.gradle.kts [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/AndroidManifest.xml for f in MainActivity CaptureService ChessAnalyzer; do [ -f $f.kt ] && mv $f.kt app/src/main/java/com/example/chesshelper/$f.kt done find . -path ./.git -prune -o -type f -print - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: chess-helper-apk
          path: app/build/outputs/apk/debug/app-debug.apk
